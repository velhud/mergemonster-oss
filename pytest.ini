[pytest]
cache_dir = .cache/pytest
markers =
    fast: provider-free tests suitable for the default inner loop
    merge: merge rendering, split output, and token-estimation behavior
    prune: prune planning, retrieval, verification, and prune API behavior
    cache: token, summary, aggregate cache, and cache-scoping behavior
    jsui: FastAPI/JS UI endpoint and static-contract behavior
    summarizer: offline summarizer orchestration, prompts and coverage behavior
    slow: deterministic but too slow for the default inner loop
    live: requires explicit live/provider-backed approval and must not run by default
